services:
  ai-agent:
    build: .
    container_name: ravi-agent_hindi_demo

    ports:
      - "8810:8810"

    env_file:
      - .env

    restart: unless-stopped

    command:
      - uvicorn
      - app.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8810"
      - --workers
      - "1"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8810/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s